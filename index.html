.tree{

.card{

  border-radius:18px;

.card.parent{

.card.child{

.name{

.role{

.birth{

  border-radius:999px;
  background:#e0e7ff;
  color:#3730a3;
  font-size:11px;
  font-weight:700

.section-title{
  text-align:center;
  margin:45px 0 20px;
  font-size:30px
}

.months{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:16px

.month{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:18px;
  box-shadow:0 7px 22px #0000000b

.month h3{
  margin:0 0 13px;
  color:#2563eb

.bday{

  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #eef2f7
}

.bday:last-child{

}

.bday .person{
  font-weight:700
}

.bday .date{
  color:#64748b;
  font-size:13px
}


/* =========================
   ANNIVERSARY
   ========================= */

  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px

/* =====================================================
   AGE CALCULATION
   =====================================================

   Example output:

   58 years 3 months 6 days

   This automatically updates whenever the
   webpage is opened/refreshed.

   ===================================================== */

function calculateAge(dateString){

  const [
    day,
    month,
    year
  ] = dateString.split("/").map(Number);


  const birthDate =
    new Date(
      year,
      month - 1,
      day
    );


  const today = new Date();


  let years =
    today.getFullYear()
    -
    birthDate.getFullYear();


  let months =
    today.getMonth()
    -
    birthDate.getMonth();


  let days =
    today.getDate()
    -
    birthDate.getDate();


  /*
     If today's day is before
     the birth day, borrow days
     from the previous month.
  */

  if(days < 0){

    months--;

    const previousMonth =
      new Date(
        today.getFullYear(),
        today.getMonth(),
        0
      );

    days +=
      previousMonth.getDate();

  }


  /*
     If today's month is before
     birth month, borrow one year.
  */

  if(months < 0){

    years--;

    months += 12;

  }


  return (
    years +
    " years " +
    months +
    " months " +
    days +
    " days"
  );

}


/* =====================================================
   COMPLETED ANNIVERSARY YEARS
   ===================================================== */

function calculateCompletedYears(dateString){

  const [
    day,
    month,
    year
  ] = dateString.split("/").map(Number);


  const today = new Date();


  let years =
    today.getFullYear()
    -
    year;


  if(
    today.getMonth() + 1 < month
    ||
    (
      today.getMonth() + 1 === month
      &&
      today.getDate() < day
    )
  ){

    years--;

  }


  return years;

}


/* =====================================================

function renderFamilies(filter=""){

  const box =
    document.getElementById("families");


  box.innerHTML="";


  families.forEach(f=>{


    const matches =
      f.people.filter(p =>
        p.join(" ")
        .toLowerCase()
        .includes(
          filter.toLowerCase()
        )
      );


    if(
      filter &&
      !matches.length
    ){

      return;

    }


    const section =
      document.createElement("section");


    section.className =
      "family";


    section.innerHTML = `

      <h2>
        ${f.title}
      </h2>

      <div class="marriage">
        ${f.spouse}
      </div>

      <div class="tree"></div>

    `;


    const tree =
      section.querySelector(".tree");


    f.people.forEach(p=>{


      if(
        filter &&
        !p.join(" ")
        .toLowerCase()
        .includes(
          filter.toLowerCase()
        )
      ){

        return;

      }


      const card =
        document.createElement("div");


      card.className =
        "card " + p[3];


      card.innerHTML = `

        <div class="name">
          ${p[0]}
        </div>

        <div class="role">
          ${p[1]}
        </div>

        <div class="birth">
          🎂 ${p[2]}
        </div>

        <span class="badge">
          ${calculateAge(p[2])}
        </span>

      `;


      tree.appendChild(card);

    });


    box.appendChild(section);

  });

}

      monthBox.innerHTML = `

          📅 ${month}
        </h3>
      `;


      list.forEach(x=>{


        const row =
          document.createElement("div");


        row.className =
          "bday";


        row.innerHTML = `

          <span class="person">
            ${x[0]}
          </span>

          <span class="date">
            ${x[1]}
          </span>

        `;


        monthBox.appendChild(row);

      });


      box.appendChild(monthBox);

    }
  );

}

}
