<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chotalal Family</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fffaf2,#f4f7ff);color:#1f2937}
header{padding:42px 20px;text-align:center;background:linear-gradient(135deg,#111827,#334155);color:#fff}
header h1{margin:0;font-size:clamp(30px,5vw,52px)}
header p{margin:10px 0 0;color:#cbd5e1}
.container{max-width:1400px;margin:auto;padding:25px 16px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
input{width:min(520px,100%);padding:14px 18px;border:1px solid #d1d5db;border-radius:14px;font-size:16px;outline:none;background:#fff}
button{border:0;border-radius:12px;padding:12px 18px;background:#2563eb;color:white;font-weight:700;cursor:pointer}
button:hover{opacity:.9}
.family{background:#fff;border-radius:24px;padding:24px;margin:22px 0;box-shadow:0 10px 35px #00000010;border:1px solid #e5e7eb}
.family h2{text-align:center;margin:0 0 6px;font-size:27px}
.family .marriage{text-align:center;color:#64748b;margin-bottom:22px}
.tree{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.card{min-width:190px;max-width:240px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:18px;padding:17px;text-align:center;transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 22px #00000012}
.card.parent{background:#eff6ff;border-color:#93c5fd}
.card.child{background:#f8fafc}
.name{font-size:18px;font-weight:800}
.role{font-size:13px;color:#64748b;margin-top:5px}
.birth{font-size:12px;margin-top:10px;color:#7c3aed;font-weight:700}
.badge{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:999px;background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:700}
.section-title{text-align:center;margin:45px 0 20px;font-size:30px}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.month{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 7px 22px #0000000b}
.month h3{margin:0 0 13px;color:#2563eb}
.bday{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eef2f7}
.bday:last-child{border-bottom:0}
.bday .person{font-weight:700}
.bday .date{color:#64748b;font-size:13px}
.hidden{display:none!important}
footer{text-align:center;padding:30px;color:#64748b}
@media(max-width:600px){.family{padding:16px}.card{min-width:100%;max-width:none}.tree{gap:12px}}
</style>
</head>
<body>
<header>
<h1>🌳 Chotalal Family</h1>
<p>A family tree • relationships • birthdays</p>
</header>

<div class="container">
<div class="toolbar">
<input id="search" placeholder="🔎 Search family member...">
<button onclick="clearSearch()">Show All</button>
</div>

<div id="families"></div>

<h2 class="section-title">🎂 Birthday Calendar</h2>
<div class="months" id="birthdays"></div>
</div>

<footer>Made with ❤️ for the Chotalal Family</footer>

<script>
const families = [
{

]},

["Rimmi","Wife of Dharmendra","11/09/1983","parent"],

const birthdayData = {
January:[["Krusha","04/01/1996"],["Divya","09/01/1995"],["Ashok","14/01/1962"],["Nishant Kumar","22/01/1990"],["Karan","24/01/1994"]],
March:[["Chirag","23/03/1985"],["Jiyan","26/03/2014"],["Charmy","27/03/1990"]],
April:[["Priti","14/04/1965"],["Dipa","15/04/1961"]],
May:[["Dharmendra","20/05/1973"],["Dhiren Kumar","26/05/1959"]],
July:[["Diya","08/07/2015"]],
August:[["Kunal","03/08/1986"],["Bhargavi","11/08/1981"],["Birju Kumar","29/08/1967"]],
September:[["Vihaana","02/09/2018"],["Rachana","07/09/1970"],["Rimmi","11/09/1983"],["Mohin","27/09/1989"]],
October:[["Pratham","04/10/2005"],["Dev","05/10/2017"],["Sunil","11/10/1967"],["Rushabh","17/10/2020"]],
November:[["Mimixa","04/11/1988"],["Helly","25/11/2002"]],
December:[["Jenish","01/12/2000"],["Kinjal","06/12/1987"],["Kevin","18/12/1994"]]
};

function age(d){
 const [day,mon,year]=d.split("/").map(Number);
 const now=new Date(); let a=now.getFullYear()-year;
 if(now.getMonth()+1<mon || (now.getMonth()+1===mon && now.getDate()<day)) a--;
 return a;
}

function renderFamilies(filter=""){
 const box=document.getElementById("families");
 box.innerHTML="";
 families.forEach(f=>{
   const matches=f.people.filter(p=>p.join(" ").toLowerCase().includes(filter.toLowerCase()));
   if(filter && !matches.length)return;
   const section=document.createElement("section");
   section.className="family";
   section.innerHTML=`<h2>${f.title}</h2><div class="marriage">${f.spouse}</div><div class="tree"></div>`;
   const tree=section.querySelector(".tree");
   f.people.forEach(p=>{
      if(filter && !p.join(" ").toLowerCase().includes(filter.toLowerCase()))return;
      const c=document.createElement("div");
      c.className="card "+p[3];
      c.innerHTML=`<div class="name">${p[0]}</div><div class="role">${p[1]}</div><div class="birth">🎂 ${p[2]}</div><span class="badge">${age(p[2])} years</span>`;
      tree.appendChild(c);
   });
   box.appendChild(section);
 });
}

function renderBirthdays(){
 const box=document.getElementById("birthdays");
 Object.entries(birthdayData).forEach(([month,list])=>{
   const m=document.createElement("div");m.className="month";
   m.innerHTML=`<h3>📅 ${month}</h3>`;
   list.forEach(x=>{
     const row=document.createElement("div");row.className="bday";
     row.innerHTML=`<span class="person">${x[0]}</span><span class="date">${x[1]}</span>`;
     m.appendChild(row);
   });
   box.appendChild(m);
 });
}
document.getElementById("search").addEventListener("input",e=>renderFamilies(e.target.value));
function clearSearch(){document.getElementById("search").value="";renderFamilies();}
renderFamilies();renderBirthdays();
</script>
</body>
</html>
